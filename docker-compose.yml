services:
  basketapi:
    build:
      context: .
      dockerfile: BasketApi/Dockerfile
    container_name: basket-api
    restart: always
    environment:
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BasketApi;User Id=sa;Password=Password123!;TrustServerCertificate=True
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    networks:
      - basket-network

  redis:
    image: redis:alpine
    container_name: basket-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - basket-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: basket-sql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Password123!", "-Q", "SELECT 1", "-C"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - basket-network

  prometheus:
    image: prom/prometheus:latest
    container_name: basket-prometheus
    restart: always
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - basket-network

  loki:
    image: grafana/loki:2.9.4
    container_name: basket-loki
    restart: always
    volumes:
      - ./config/loki/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - basket-network

  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: basket-vector
    restart: always
    volumes:
      - ./config/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - loki
    networks:
      - basket-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: basket-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_INSTALL_PLUGINS=grafana-sentry-datasource
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - basket-network

networks:
  basket-network:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
