services:
  basketapi:
    build:
      context: .
      dockerfile: BasketApi/Dockerfile
    container_name: basket-api
    restart: always
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BasketApi;User Id=sa;Password=Password123!;TrustServerCertificate=True
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    networks:
      - basket-network

  redis:
    image: redis:alpine
    container_name: basket-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - basket-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: basket-sql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Password123!", "-Q", "SELECT 1", "-C"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - basket-network

networks:
  basket-network:
    driver: bridge
